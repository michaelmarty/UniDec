name: GUI and workflow tests

on:
  push:
    paths:
      - ".github/workflows/test-gui-workflows.yml"
      - "pyproject.toml"
      - "tests/**"
      - "unidec/**"
  pull_request:
    paths:
      - ".github/workflows/test-gui-workflows.yml"
      - "pyproject.toml"
      - "tests/**"
      - "unidec/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-gui-workflows:
    name: Windows / Python 3.12
    runs-on: windows-latest
    timeout-minutes: 20

    env:
      UNIDEC_IMPORTER_TEST_DATA: ${{ github.workspace }}\UniDecImporter\TestData
      UNIDEC_REQUIRE_IMPORTER_TEST_DATA: "1"

    steps:
      - name: Check out UniDec
        uses: actions/checkout@v7
        with:
          lfs: true
          persist-credentials: false

      - name: Check out UniDecImporter fixtures
        uses: actions/checkout@v7
        with:
          repository: michaelmarty/UniDecImporter
          ref: 7e2294d87a29f25c229742b95f39a8a269e556d9
          path: UniDecImporter
          lfs: false
          sparse-checkout: |
            TestData/IMMS/test_watersimms_txt.txt
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Pull and verify IM-MS fixture
        shell: pwsh
        run: |
          git -C UniDecImporter lfs pull --include="TestData/IMMS/test_watersimms_txt.txt"
          $fixture = Join-Path $env:UNIDEC_IMPORTER_TEST_DATA "IMMS\test_watersimms_txt.txt"
          if (-not (Test-Path -LiteralPath $fixture -PathType Leaf)) {
            throw "Required IM-MS fixture was not checked out: $fixture"
          }
          if ((Get-Item -LiteralPath $fixture).Length -lt 1000000) {
            throw "IM-MS fixture is still a Git LFS pointer: $fixture"
          }

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install UniDec and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run GUI launch and workflow tests
        run: python -m unittest discover -s tests -p "test_*.py" -v
