name: Build and publish

on:
  workflow_dispatch:
    inputs:
      publish_to_pypi:
        description: Also publish release artifacts to PyPI?
        required: true
        default: "false"
        type: choice
        options: ["false", "true"]
  release:
    types: [published]

permissions:
  contents: read

env:
  ONEAPI_WINDOWS_URL: https://registrationcenter-download.intel.com/akdlm/IRC_NAS/bae85ab1-cfcd-4251-8d42-a0c27949ea33/intel-oneapi-toolkit-2026.0.0.193_offline.exe
  ONEAPI_WINDOWS_VERSION: 2026.0.0.193
  ONEAPI_WINDOWS_COMPONENTS: intel.oneapi.win.cpp-dpcpp-common

jobs:
  metadata:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v6
      - id: version
        shell: bash
        env:
          PUBLISHED_TAG: ${{ github.event.release.tag_name }}
        run: |
          version="$(sed -nE 's/^__version__[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' isodec/_version.py)"
          test -n "$version"
          tag="v$version"
          if [[ "${{ github.event_name }}" == "release" && "$PUBLISHED_TAG" != "$tag" ]]; then
            echo "Release tag does not match isodec/_version.py" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade build
      - name: Build and test MSVC comparison wheel
        shell: pwsh
        run: |
          python -m build --wheel --outdir dist-msvc
          python -m venv "${{ runner.temp }}\msvc-test"
          $python = "${{ runner.temp }}\msvc-test\Scripts\python.exe"
          $wheel = (Get-ChildItem 'dist-msvc\*.whl').FullName
          & $python -m pip install $wheel pytest
          Push-Location "${{ runner.temp }}"
          & $python -m pytest "${{ github.workspace }}\tests" --import-mode=importlib
          Pop-Location
      - name: Install Intel oneAPI compiler
        shell: cmd
        run: |
          curl.exe --fail --location --retry 5 --output "%RUNNER_TEMP%\oneapi.exe" "%ONEAPI_WINDOWS_URL%"
          start /b /wait "" "%RUNNER_TEMP%\oneapi.exe" -s -x -f "%RUNNER_TEMP%\oneapi-extracted" --log extract.log
          "%RUNNER_TEMP%\oneapi-extracted\bootstrapper.exe" -s --action install --components=%ONEAPI_WINDOWS_COMPONENTS% --eula=accept -p=NEED_VS2022_INTEGRATION=0 --log-dir=.
      - name: Build Intel release wheel
        shell: cmd
        run: |
          call "C:\Program Files (x86)\Intel\oneAPI\setvars-vcvarsall.bat" vs2022
          call "C:\Program Files (x86)\Intel\oneAPI\compiler\latest\env\vars.bat"
          set "CC=icx-cl"
          set "CXX=icx-cl"
          set "CMAKE_GENERATOR=Ninja"
          set "CMAKE_ARGS=-DISODEC_REQUIRE_INTELLLVM=ON -DISOGEN_REQUIRE_INTELLLVM=ON"
          python -m build --wheel --outdir dist
      - uses: actions/upload-artifact@v7
        with:
          name: wheel-Windows
          path: dist/*.whl
          if-no-files-found: error

  windows-arm64:
    runs-on: windows-11-vs2026-arm
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          architecture: arm64
      - name: Install ARM64 FFTW with vcpkg
        shell: pwsh
        run: |
          $vcpkgRoot = (Resolve-Path -LiteralPath $env:VCPKG_INSTALLATION_ROOT).Path.Replace('\', '/')
          & "$vcpkgRoot/vcpkg.exe" install fftw3:arm64-windows
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "CMAKE_GENERATOR=Visual Studio 18 2026" >> $env:GITHUB_ENV
          "CMAKE_GENERATOR_PLATFORM=ARM64" >> $env:GITHUB_ENV
          "CMAKE_ARGS=-DCMAKE_TOOLCHAIN_FILE=$vcpkgRoot/scripts/buildsystems/vcpkg.cmake -DVCPKG_TARGET_TRIPLET=arm64-windows -DFFTW3_ROOT=$vcpkgRoot/installed/arm64-windows" >> $env:GITHUB_ENV
      - run: python -m pip install --upgrade build
      - run: python -m build --wheel --outdir dist
      - name: Install and test ARM64 wheel
        shell: pwsh
        run: |
          $wheel = @(Get-ChildItem -LiteralPath dist -Filter '*-win_arm64.whl')
          if ($wheel.Count -ne 1) { throw "Expected one Windows ARM64 wheel, found $($wheel.Count)." }
          python -m venv "${{ runner.temp }}\arm64-test"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $testPython = "${{ runner.temp }}\arm64-test\Scripts\python.exe"
          & $testPython -m pip install --only-binary=:all: $wheel[0].FullName pytest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Push-Location "${{ runner.temp }}"
          try {
            & $testPython -m pytest "${{ github.workspace }}\tests" --import-mode=importlib
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          finally { Pop-Location }
      - uses: actions/upload-artifact@v7
        with:
          name: wheel-Windows-ARM64
          path: dist/*-win_arm64.whl
          if-no-files-found: error

  linux:
    name: Build Linux wheel (${{ matrix.arch }})
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: sudo apt-get update && sudo apt-get install --yes libfftw3-dev
      - run: python -m pip install --upgrade build auditwheel patchelf
      - run: python -m build --wheel
      - run: mkdir wheelhouse && auditwheel repair dist/*.whl --wheel-dir wheelhouse
      - run: rm dist/*.whl && mv wheelhouse/*.whl dist/
      - name: Install and test wheel
        working-directory: ${{ runner.temp }}
        run: |
          python -m venv wheel-test
          wheel-test/bin/python -m pip install "${{ github.workspace }}"/dist/*.whl pytest
          wheel-test/bin/python -m pytest "${{ github.workspace }}/tests" --import-mode=importlib
      - uses: actions/upload-artifact@v7
        with:
          name: wheel-Linux-${{ matrix.arch }}
          path: dist/*.whl
          if-no-files-found: error

  macos:
    strategy:
      matrix:
        include:
          - runner: macos-15-intel
            arch: x86_64
          - runner: macos-14
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install macOS native dependency
        run: |
          brew untap aws/tap 2>/dev/null || true
          brew install fftw
      - run: python -m pip install --upgrade build delocate
      - run: python -m build --wheel
      - run: mkdir wheelhouse && delocate-wheel --require-archs "${{ matrix.arch }}" -w wheelhouse -v dist/*.whl
      - run: rm dist/*.whl && mv wheelhouse/*.whl dist/
      - uses: actions/upload-artifact@v7
        with:
          name: wheel-macOS-${{ matrix.arch }}
          path: dist/*.whl
          if-no-files-found: error

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade build twine
      - run: python -m build --sdist
      - run: python -m twine check dist/*
      - uses: actions/upload-artifact@v7
        with:
          name: source-distribution
          path: dist/*.tar.gz
          if-no-files-found: error

  github-release:
    if: github.event_name == 'workflow_dispatch'
    needs: [metadata, windows, windows-arm64, linux, macos, sdist]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: wheel-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v8
        with:
          name: source-distribution
          path: dist
      - env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.metadata.outputs.tag }}
        run: gh release create "$RELEASE_TAG" dist/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "$RELEASE_TAG" --generate-notes

  publish:
    if: >-
      always() &&
      (github.event_name == 'release' || github.event.inputs.publish_to_pypi == 'true') &&
      (github.event_name == 'release' || needs.github-release.result == 'success') &&
      needs.metadata.result == 'success' && needs.windows.result == 'success' &&
      needs.windows-arm64.result == 'success' && needs.linux.result == 'success' &&
      needs.macos.result == 'success' &&
      needs.sdist.result == 'success'
    needs: [metadata, windows, windows-arm64, linux, macos, sdist, github-release]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/isodec
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: wheel-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v8
        with:
          name: source-distribution
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
