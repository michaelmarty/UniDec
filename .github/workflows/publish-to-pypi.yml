name: Publish Python package

on:
  push:
    tags:
      - "*"
  workflow_dispatch:
    inputs:
      repository:
        description: Package index to publish to
        required: true
        default: testpypi
        type: choice
        options:
          - testpypi
          - pypi

permissions:
  contents: read

jobs:
  build:
    name: Build and test distributions
    runs-on: windows-latest

    steps:
      - name: Check out the tagged source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install packaging tools
        run: python -m pip install --upgrade build twine

      - name: Build wheel and source distribution
        run: python -m build --outdir distpypi

      - name: Check distribution metadata
        run: python -m twine check distpypi/*

      - name: Install and smoke-test the wheel
        shell: pwsh
        run: |
          python -m venv .venv
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .venv\Scripts\python -m pip install --upgrade pip
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $wheel = (Get-ChildItem -LiteralPath distpypi -Filter *.whl).FullName
          .venv\Scripts\python -m pip install $wheel
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          @'
          from importlib.resources import files
          from pathlib import Path
          import subprocess
          import sys
          import tempfile

          import isodec
          import unidec
          # Required by the GUI; verify the published dependency provides these APIs.
          from isodec import match_fragments
          from isodec.fragment_view import plot_fragment_matches

          for package in (unidec, isodec):
              location = Path(package.__file__).resolve()
              if not location.is_relative_to(Path(sys.prefix).resolve()):
                  raise RuntimeError(f"Expected an installed wheel, found {location}")

          with tempfile.TemporaryDirectory(prefix="unidec-wheel-") as directory:
              workdir = Path(directory)
              spectra = files("unidec").joinpath("bin", "TestSpectra")
              for name in ("test_1.txt", "test_2.txt"):
                  (workdir / name).write_bytes(spectra.joinpath(name).read_bytes())
              subprocess.run(
                  [sys.executable, "-I", "-m", "isodec", "test_2.txt", "--centroided",
                   "-o", "isodec.tsv"], cwd=workdir, check=True, timeout=180,
              )
              subprocess.run(
                  [sys.executable, "-I", "-m", "unidec", "test_1.txt"],
                  cwd=workdir, check=True, timeout=180,
              )
              for output in (workdir / "isodec.tsv",
                             workdir / "test_1_unidecfiles" / "test_1_mass.txt"):
                  if not output.is_file() or output.stat().st_size == 0:
                      raise RuntimeError(f"CLI did not produce output: {output}")
          '@ | .venv\Scripts\python -I -
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Store distributions
        uses: actions/upload-artifact@v5
        with:
          name: python-package-distributions
          path: distpypi/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish distributions
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.event_name == 'workflow_dispatch' && inputs.repository || 'pypi' }}
      url: ${{ (github.event_name == 'workflow_dispatch' && inputs.repository == 'testpypi') && 'https://test.pypi.org/p/UniDec' || 'https://pypi.org/p/UniDec' }}
    permissions:
      id-token: write

    steps:
      - name: Download distributions
        uses: actions/download-artifact@v6
        with:
          name: python-package-distributions
          path: distpypi/

      - name: Publish distributions to TestPyPI
        if: github.event_name == 'workflow_dispatch' && inputs.repository == 'testpypi'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: distpypi/
          repository-url: https://test.pypi.org/legacy/

      - name: Publish distributions to PyPI
        if: github.event_name != 'workflow_dispatch' || inputs.repository == 'pypi'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: distpypi/
