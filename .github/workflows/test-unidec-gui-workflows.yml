name: UniDec native and GUI workflow tests

on:
  push:
    paths:
      - ".github/workflows/test-unidec-gui-workflows.yml"
      - "public/UniDec/.github/workflows/test-gui-workflows.yml"
      - "public/UniDec/build_native.sh"
      - "public/UniDec/pyproject.toml"
      - "public/UniDec/tests/**"
      - "public/UniDec/unidec/**"
  pull_request:
    paths:
      - ".github/workflows/test-unidec-gui-workflows.yml"
      - "public/UniDec/.github/workflows/test-gui-workflows.yml"
      - "public/UniDec/build_native.sh"
      - "public/UniDec/pyproject.toml"
      - "public/UniDec/tests/**"
      - "public/UniDec/unidec/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  platform-workflows:
    name: ${{ matrix.name }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            python-version: "3.12"
            build_native: false
            gui_tests: true
          - name: Linux
            os: ubuntu-latest
            python-version: "3.12"
            build_native: true
            gui_tests: false
          - name: macOS ARM64
            os: macos-14
            python-version: "3.12"
            build_native: true
            gui_tests: true
          - name: macOS Intel
            os: macos-15-intel
            python-version: "3.12"
            build_native: true
            gui_tests: true

    env:
      UNIDEC_IMPORTER_TEST_DATA: ${{ github.workspace }}/UniDecImporter/TestData
      UNIDEC_REQUIRE_IMPORTER_TEST_DATA: "1"

    steps:
      - name: Check out UniDecDev
        uses: actions/checkout@v7
        with:
          lfs: true
          persist-credentials: false

      - name: Check out UniDecImporter fixtures
        if: matrix.gui_tests
        uses: actions/checkout@v7
        with:
          repository: michaelmarty/UniDecImporter
          ref: 7e2294d87a29f25c229742b95f39a8a269e556d9
          path: UniDecImporter
          lfs: false
          sparse-checkout: |
            TestData/IMMS/test_watersimms_txt.txt
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: public/UniDec/pyproject.toml

      - name: Pull IM-MS fixture
        if: matrix.gui_tests
        run: git -C UniDecImporter lfs pull --include="TestData/IMMS/test_watersimms_txt.txt"

      - name: Verify IM-MS fixture
        if: matrix.gui_tests
        run: >-
          python -c "import os; from pathlib import Path;
          p = Path(os.environ['UNIDEC_IMPORTER_TEST_DATA']) / 'IMMS' / 'test_watersimms_txt.txt';
          assert p.is_file(), f'Missing fixture: {p}';
          assert p.stat().st_size >= 1000000, f'Fixture is still a Git LFS pointer: {p}'"

      - name: Install Linux native dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes libfftw3-dev libhdf5-dev pkg-config

      - name: Install macOS native dependencies
        if: runner.os == 'macOS'
        run: |
          brew untap aws/tap 2>/dev/null || true
          brew install fftw hdf5 libomp pkg-config

      - name: Build native UniDec
        if: matrix.build_native
        working-directory: public/UniDec
        run: bash ./build_native.sh

      - name: Install UniDec and GUI test dependencies
        if: matrix.gui_tests
        working-directory: public/UniDec
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Install UniDec for headless tests
        if: ${{ !matrix.gui_tests }}
        working-directory: public/UniDec
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Run GUI and workflow tests
        if: matrix.gui_tests
        working-directory: public/UniDec
        run: python -m unittest discover -s tests -p "test_*.py" -v

      - name: Run headless engine and native tests
        if: ${{ !matrix.gui_tests }}
        working-directory: public/UniDec
        run: |
          python -m unittest discover -s tests -p "test_im_engine_split.py" -v
          python -m unittest discover -s tests -p "test_native_build.py" -v
