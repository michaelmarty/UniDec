name: UniDec Windows ARM64 native build

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  windows-arm64-build:
    name: Windows ARM64 native build
    runs-on: windows-11-arm
    timeout-minutes: 90

    steps:
      - name: Check out UniDecDev
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install native dependencies with vcpkg
        shell: pwsh
        run: |
          $vcpkgRoot = (Resolve-Path -LiteralPath $env:VCPKG_INSTALLATION_ROOT).Path.Replace('\', '/')
          & "$vcpkgRoot/vcpkg.exe" install "hdf5[hl]:arm64-windows" "fftw3:arm64-windows"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $hdf5Libraries = "$vcpkgRoot/installed/arm64-windows/lib"
          if (-not (Get-ChildItem -LiteralPath $hdf5Libraries -Filter '*hdf5*hl*.lib')) {
            throw "vcpkg did not install the HDF5 high-level library in $hdf5Libraries"
          }
          "VCPKG_ROOT_PATH=$vcpkgRoot" >> $env:GITHUB_ENV

      - name: Configure and build Windows ARM64
        shell: pwsh
        run: |
          cmake -S public/UniDec/unidec/src -B build/unidec-windows-arm64 -G "Visual Studio 17 2022" -A ARM64 `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_ROOT_PATH/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=arm64-windows `
            -DHDF5_ROOT="$env:VCPKG_ROOT_PATH/installed/arm64-windows" `
            -DFFTW_ROOT="$env:VCPKG_ROOT_PATH/installed/arm64-windows" `
            -DUNIDEC_ENABLE_OPENMP=OFF
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build build/unidec-windows-arm64 --config Release --parallel
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Smoke test ARM64 executable
        shell: pwsh
        run: |
          $env:PATH = "$env:VCPKG_ROOT_PATH/installed/arm64-windows/bin;$env:PATH"
          $PSNativeCommandUseErrorActionPreference = $false
          $output = & public/UniDec/unidec/bin/unidec.exe 2>&1
          $exitCode = $LASTEXITCODE
          $text = $output -join "`n"
          if ($exitCode -ne 88) { throw "UniDec exited with $exitCode instead of 88.`n$text" }
          if ($text -notmatch 'Universal Deconvolution') { throw 'UniDec help output was not produced.' }
          if (-not (Test-Path -LiteralPath public/UniDec/unidec/bin/unideclib.dll -PathType Leaf)) {
            throw 'The ARM64 shared library was not deployed.'
          }
          exit 0
